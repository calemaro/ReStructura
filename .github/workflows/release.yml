name: Release

# Runs when a version tag is pushed. Builds the app on each operating system
# — a macOS build needs a Mac, a Windows build needs Windows, and GitHub
# provides both — then attaches every installer to a draft GitHub Release.
#
#   git tag -a v0.3.0 -m "…" && git push origin v0.3.0
#
# The release is created as a DRAFT: check the files, write the notes, publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # also runnable by hand from the Actions tab

permissions:
  contents: write           # needed to create the release and upload the files

jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing must not cancel the others
      matrix:
        include:
          - platform: ubuntu-22.04     # oldest supported glibc: binaries run on newer distros too
            args: ""
          - platform: macos-latest     # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest     # Intel Macs
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac targets are built on the same runner, so it needs both.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's bundled `strip` aborts on the .relr.dyn section that
          # modern toolchains emit; skipping it does not change the result.
          NO_STRIP: true
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ReStructura ${{ github.ref_name }}"
          releaseBody: "Download the file for your system below. Windows and macOS builds are unsigned, so the system will warn on first run."
          releaseDraft: true
          args: ${{ matrix.args }}
