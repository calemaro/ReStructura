[package]
name = "planfloorviewer"
version = "0.1.0"
description = "Pin photos, notes and measurements to a floor plan to document what is inside your walls."
authors = ["calemaro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "planfloorviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = "8.6.0"
tauri-plugin-dialog = "2.7.3"
chrono = { version = "0.4.45", features = ["serde"] }
trash = "5.2.9"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
