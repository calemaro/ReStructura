<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReStructura</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main menu header: app-wide controls only -->
    <header class="toolbar menu-bar" id="menu-bar">
      <div class="brand"><span class="brand-name" data-i18n="app.title"></span><span class="brand-tagline" data-i18n="app.tagline"></span></div>
      <button class="btn-settings" type="button" data-i18n-attr="title:settings.open,aria-label:settings.open">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <!-- Plan header: shown only while a project is open -->
    <header class="toolbar plan-bar" id="plan-bar" hidden>
      <div class="brand">
        <button id="btn-projects" type="button" class="back" data-i18n-attr="title:menu.back">‹ <span data-i18n="menu.back"></span></button>
        <span class="crumb-sep">/</span>
        <span id="project-name" class="project-name"></span>
      </div>
      <div class="toolbar-right">
        <span class="btn-group mode-switch" role="group" data-i18n-attr="aria-label:mode.label">
          <button id="mode-document" type="button" aria-pressed="true" data-i18n-attr="title:mode.documentTip">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span data-i18n="mode.document"></span>
          </button>
          <button id="mode-draw" type="button" aria-pressed="false" data-i18n-attr="title:mode.drawTip">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V3l18 18z"/><path d="M7 17v-5l5 5z"/></svg>
            <span data-i18n="mode.draw"></span>
          </button>
        </span>
        <label class="level">
          <span data-i18n="toolbar.level"></span>
          <select id="level-select"></select>
        </label>
        <button id="btn-rename-floor" type="button" class="icon-btn" data-i18n-attr="title:floor.rename,aria-label:floor.rename">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <span class="btn-group">
          <button id="btn-undo" type="button" disabled data-i18n-attr="title:toolbar.undo,aria-label:toolbar.undo">↶</button>
          <button id="btn-redo" type="button" disabled data-i18n-attr="title:toolbar.redo,aria-label:toolbar.redo">↷</button>
        </span>
        <button id="btn-add-menu" type="button" class="primary"><span data-i18n="menu.add"></span> ▾</button>
        <button id="btn-add" type="button" class="primary" hidden data-i18n="toolbar.addPin"></button>
        <button id="btn-room" type="button" hidden data-i18n="room.add"></button>
        <button id="btn-import-plan" type="button" hidden data-i18n="toolbar.importPlan"></button>
        <button id="btn-search" type="button" data-i18n-attr="title:search.open"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
        <button id="btn-export" type="button"><span data-i18n="export.title"></span> ▾</button>
        <button id="btn-fit" type="button" data-i18n="toolbar.zoomFit"></button>
        <button class="btn-settings" type="button" data-i18n-attr="title:settings.open,aria-label:settings.open">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <div id="plan" class="plan"></div>
      <!-- Plan editor (Draw mode): tool palette on the left, options for the tool on top -->
      <nav id="editor-tools" class="editor-tools" hidden data-i18n-attr="aria-label:editor.tools">
        <button type="button" data-tool="select" data-i18n-attr="title:editor.selectTip">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 3l12 10-5.5.8L15 20l-2.5 1-2.6-6.2L6 18z" fill="currentColor"/></svg>
          <span data-i18n="editor.select"></span>
        </button>
        <button type="button" data-tool="wall" data-i18n-attr="title:editor.wallTip">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M3 12h18M9 6v6M15 12v6"/></svg>
          <span data-i18n="editor.wall"></span>
        </button>
        <button type="button" data-tool="door" data-i18n-attr="title:editor.doorTip">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 20h4M20 20h2" stroke-width="3"/><path d="M6 20V6"/><path d="M6 6a14 14 0 0 1 14 14" stroke-width="1.2"/></svg>
          <span data-i18n="editor.door"></span>
        </button>
        <button type="button" data-tool="window" data-i18n-attr="title:editor.windowTip">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M1 12h3M20 12h3" stroke-width="6"/><path d="M4 8h16M4 16h16M4 8v8M20 8v8" stroke-width="1.4"/><path d="M4 11h16M4 13h16" stroke-width="1.2"/></svg>
          <span data-i18n="editor.window"></span>
        </button>
      </nav>
      <div id="editor-bar" class="editor-bar" hidden>
        <strong id="ed-tool-name" class="ed-tool-name"></strong>
        <label class="ed-field" data-field="kind"><span data-i18n="editor.type"></span><select id="ed-kind"></select></label>
        <label class="ed-field" data-field="length" data-i18n-attr="title:editor.unitTip"><span data-i18n="editor.length"></span><input id="ed-length" type="text" autocomplete="off" spellcheck="false"><em class="ed-unit"></em></label>
        <label class="ed-field" data-field="width" data-i18n-attr="title:editor.unitTip"><span data-i18n="editor.width"></span><input id="ed-width" type="text" autocomplete="off" spellcheck="false"><em class="ed-unit"></em></label>
        <label class="ed-field" data-field="from" data-i18n-attr="title:editor.fromTip"><span data-i18n="editor.fromCorner"></span><input id="ed-from" type="text" autocomplete="off" spellcheck="false"><em class="ed-unit"></em></label>
        <label class="ed-field" data-field="thickness" data-i18n-attr="title:editor.unitTip"><span data-i18n="editor.thickness"></span><input id="ed-thickness" type="text" autocomplete="off" spellcheck="false"><em class="ed-unit"></em></label>
        <span class="ed-field ed-flips" data-field="flip">
          <button id="ed-flip-side" type="button" data-i18n-attr="title:editor.flipSideTip">⇅ <span data-i18n="editor.flipSide"></span></button>
          <button id="ed-flip-hinge" type="button" data-i18n-attr="title:editor.flipHingeTip">⇆ <span data-i18n="editor.flipHinge"></span></button>
        </span>
        <label class="ed-field" data-field="image"><span data-i18n="editor.image"></span><input id="ed-image" type="range" min="0" max="100" step="5"></label>
      </div>
      <!-- Search panel -->
      <aside id="search-panel" class="panel search-panel" hidden>
        <div class="panel-head">
          <h2 data-i18n="search.title"></h2>
          <button id="search-close" type="button" class="icon-btn" data-i18n-attr="title:search.close,aria-label:search.close">×</button>
        </div>
        <div class="search-controls">
          <input id="search-input" type="search" autocomplete="off" data-i18n-attr="placeholder:search.placeholder">
          <div class="search-filters">
            <label><span data-i18n="search.floor"></span><select id="filter-floor"></select></label>
            <label><span data-i18n="search.category"></span><select id="filter-category"></select></label>
            <label><span data-i18n="search.room"></span><select id="filter-room"></select></label>
            <label class="chk"><input type="checkbox" id="filter-photos"><span data-i18n="search.hasPhotos"></span></label>
            <label class="chk"><input type="checkbox" id="filter-measurements"><span data-i18n="search.hasMeasurements"></span></label>
            <button id="filter-clear" type="button" class="linkbtn" data-i18n="search.clear"></button>
          </div>
          <p id="search-count" class="search-count mono"></p>
        </div>
        <ul id="search-results" class="search-results"></ul>
      </aside>

      <!-- Room detail panel -->
      <aside id="room-panel" class="panel" hidden>
        <div class="panel-head">
          <h2 data-i18n="room.title"></h2>
          <span id="room-save-state" class="save-state" aria-live="polite"></span>
          <button id="room-close" type="button" class="icon-btn" data-i18n-attr="title:panel.close,aria-label:panel.close">×</button>
        </div>
        <dl class="panel-body">
          <dt><label for="room-name" data-i18n="room.name"></label></dt>
          <dd><input id="room-name" type="text" autocomplete="off" maxlength="80" data-i18n-attr="placeholder:room.namePlaceholder"></dd>
          <dt><label for="room-ceiling" data-i18n="room.ceiling"></label></dt>
          <dd class="meas-row"><input id="room-ceiling" type="text" inputmode="decimal" autocomplete="off" data-i18n-attr="placeholder:meas.valuePlaceholder"><span class="meas-fmt" id="room-ceiling-fmt"></span></dd>
        </dl>
        <div class="panel-foot">
          <button id="room-move" type="button" data-i18n="room.move"></button>
          <span class="spacer"></span>
          <button id="room-delete" type="button" class="danger" data-i18n="room.delete"></button>
        </div>
      </aside>

      <!-- Legend: category colours for the current scheme; click to filter -->
      <aside id="legend" class="legend" hidden>
        <div class="legend-head">
          <strong data-i18n="legend.title"></strong>
          <button id="legend-toggle" type="button" class="icon-btn legend-toggle" aria-expanded="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <label class="legend-scheme"><span data-i18n="legend.scheme"></span><select id="scheme-select"></select></label>
        </div>
        <ul id="legend-list" class="legend-list"></ul>
        <p class="legend-hint" data-i18n="legend.hint"></p>
      </aside>

      <!-- Empty project: the two ways to get a first plan -->
      <section id="plan-empty" class="plan-empty" hidden>
        <div class="start">
          <h2 data-i18n="start.title"></h2>
          <p class="start-intro" data-i18n="start.intro"></p>
          <div class="start-choices">
            <button id="start-import" type="button" class="start-card">
              <strong data-i18n="start.import"></strong>
              <span data-i18n="start.importHint"></span>
            </button>
            <button id="start-draw" type="button" class="start-card">
              <strong data-i18n="start.draw"></strong>
              <span data-i18n="start.drawHint"></span>
            </button>
          </div>
        </div>
      </section>

      <aside id="panel" class="panel" hidden>
        <div class="panel-head">
          <h2 data-i18n="panel.title"></h2>
          <span id="pin-save-state" class="save-state" aria-live="polite"></span>
          <button id="panel-close" type="button" class="icon-btn" data-i18n-attr="title:panel.close,aria-label:panel.close">×</button>
        </div>
        <dl class="panel-body">
          <dt><label for="pin-category" data-i18n="panel.category"></label></dt>
          <dd class="cat-row"><span id="pin-swatch" class="swatch"></span><select id="pin-category"></select></dd>
          <dt><label for="pin-label" data-i18n="panel.label"></label></dt>
          <dd><input id="pin-label" type="text" autocomplete="off" maxlength="120" data-i18n-attr="placeholder:panel.labelPlaceholder"></dd>
          <dt><label for="pin-notes" data-i18n="panel.notes"></label></dt>
          <dd><textarea id="pin-notes" rows="7" data-i18n-attr="placeholder:panel.notesPlaceholder"></textarea></dd>
          <dt data-i18n="photos.title"></dt>
          <dd class="photos">
            <div id="photo-grid" class="photo-grid"></div>
            <p id="photos-none" class="photos-none" data-i18n="photos.none"></p>
            <button id="btn-attach" type="button" data-i18n="photos.attach"></button>
          </dd>
          <dt data-i18n="meas.title"></dt>
          <dd class="meas">
            <div class="meas-row">
              <label for="meas-height" data-i18n="meas.height"></label>
              <input id="meas-height" type="text" inputmode="decimal" autocomplete="off" data-i18n-attr="placeholder:meas.valuePlaceholder">
              <span class="meas-fmt" id="meas-height-fmt"></span>
            </div>
            <div class="meas-row">
              <label for="meas-depth" data-i18n="meas.depth"></label>
              <input id="meas-depth" type="text" inputmode="decimal" autocomplete="off" data-i18n-attr="placeholder:meas.valuePlaceholder">
              <span class="meas-fmt" id="meas-depth-fmt"></span>
            </div>
            <div class="meas-sub" data-i18n="meas.distances"></div>
            <div id="meas-distances"></div>
            <button id="meas-add" type="button" class="linkbtn" data-i18n="meas.add"></button>
            <p class="meas-hint" data-i18n="meas.hint"></p>
            <p class="meas-error" id="meas-error" hidden></p>
          </dd>
          <dt><label for="pin-room" data-i18n="panel.room"></label></dt>
          <dd><select id="pin-room"></select></dd>
          <dt data-i18n="panel.position"></dt>
          <dd id="pin-position" class="mono"></dd>
          <dt data-i18n="panel.created"></dt>
          <dd id="pin-created" class="mono"></dd>
        </dl>
        <div class="panel-foot">
          <button id="pin-edit-pos" type="button" data-i18n="panel.editPosition"></button>
          <span class="spacer"></span>
          <button id="pin-delete" type="button" class="danger" data-i18n="panel.delete"></button>
        </div>
      </aside>

      <!-- Project chooser: shown on start and from the toolbar -->
      <section id="chooser" class="chooser" hidden>
        <div class="chooser-card">
          <div class="chooser-head">
            <h1 data-i18n="chooser.title"></h1>
          </div>
          <p class="chooser-intro" data-i18n="chooser.intro"></p>
          <form id="new-project" class="new-project">
            <input id="new-project-name" type="text" maxlength="80" autocomplete="off" data-i18n-attr="placeholder:chooser.newPlaceholder">
            <button type="submit" class="primary" data-i18n="chooser.create"></button>
            <button id="btn-import-project" type="button" data-i18n="chooser.import"></button>
          </form>
          <input id="project-search" type="search" class="project-search" autocomplete="off"
                 data-i18n-attr="placeholder:chooser.searchPlaceholder,aria-label:chooser.search" hidden>
          <ul id="project-list" class="project-list"></ul>
          <p id="chooser-where" class="chooser-where mono"></p>
        </div>
      </section>

      <!-- Full-size photo viewer -->
      <div id="viewer" class="viewer" hidden>
        <button id="viewer-close" type="button" class="viewer-btn close" data-i18n-attr="title:viewer.close,aria-label:viewer.close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button id="viewer-prev" type="button" class="viewer-btn prev" data-i18n-attr="title:viewer.prev,aria-label:viewer.prev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
        </button>
        <button id="viewer-next" type="button" class="viewer-btn next" data-i18n-attr="title:viewer.next,aria-label:viewer.next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>
        </button>
        <div class="viewer-stage" id="viewer-stage"><img id="viewer-img" alt=""></div>
        <div class="viewer-foot">
          <span id="viewer-counter" class="mono"></span>
          <input id="viewer-caption" type="text" maxlength="200" autocomplete="off" data-i18n-attr="placeholder:photos.captionPlaceholder">
          <button id="viewer-remove" type="button" class="danger" data-i18n="photos.remove"></button>
        </div>
      </div>

      <!-- Settings: a full screen, like the main menu -->
      <section id="settings" class="chooser" hidden>
        <div class="chooser-card settings-card">
          <div class="chooser-head">
            <h1 data-i18n="settings.title"></h1>
            <button id="settings-close" type="button" class="icon-btn" data-i18n-attr="title:settings.close,aria-label:settings.close">×</button>
          </div>

          <div class="settings-columns">
          <div>
          <h2 class="settings-section" data-i18n="settings.app"></h2>
          <p class="settings-hint" data-i18n="settings.appHint"></p>
          <dl class="settings-grid">
            <dt><label for="set-language" data-i18n="settings.language"></label></dt>
            <dd><select id="set-language"></select></dd>
            <dt><label for="set-theme" data-i18n="settings.theme"></label></dt>
            <dd><select id="set-theme"></select></dd>
            <dt><label for="set-units" data-i18n="settings.units"></label></dt>
            <dd><select id="set-units"></select><p class="settings-hint" data-i18n="settings.unitsHint"></p></dd>
            <dt><label for="set-scheme" data-i18n="settings.defaultScheme"></label></dt>
            <dd><select id="set-scheme"></select></dd>
            <dt data-i18n="settings.storage"></dt>
            <dd class="settings-path"><span id="set-storage" class="mono"></span>
              <button id="set-open-folder" type="button" data-i18n="settings.openFolder"></button></dd>
          </dl>

          </div>
          <!-- Only present when a project is open: opened from the main menu, the
               settings screen shows application preferences and nothing else. -->
          <div id="settings-project-section" hidden>
            <h2 class="settings-section" data-i18n="settings.project"></h2>
            <p class="settings-hint" data-i18n="settings.projectHint"></p>
            <dl class="settings-grid" id="settings-project">
              <dt><label for="set-project-name" data-i18n="settings.projectName"></label></dt>
              <dd><input id="set-project-name" type="text" maxlength="80" autocomplete="off"></dd>
              <dt><label for="set-project-scheme" data-i18n="settings.projectScheme"></label></dt>
              <dd><select id="set-project-scheme"></select></dd>
              <dt data-i18n="settings.stats"></dt>
              <dd id="set-stats" class="mono"></dd>
            </dl>
          </div>
          </div>
        </div>
      </section>

      <!-- Report options -->
      <dialog id="report-dialog" class="ask">
        <form method="dialog">
          <label data-i18n="report.title"></label>
          <div class="report-options">
            <label class="chk"><input type="radio" name="report-scope" value="project" checked><span data-i18n="report.scopeProject"></span></label>
            <label class="chk"><input type="radio" name="report-scope" value="floor"><span data-i18n="report.scopeFloor"></span></label>
            <label class="chk"><input type="checkbox" id="report-photos" checked><span data-i18n="report.withPhotos"></span></label>
          </div>
          <p class="ask-hint" data-i18n="report.printHint"></p>
          <p id="report-progress" class="ask-hint" hidden></p>
          <div class="ask-actions">
            <button type="button" id="report-cancel" data-i18n="dialog.cancel"></button>
            <button type="submit" class="primary" id="report-go" data-i18n="report.build"></button>
          </div>
        </form>
      </dialog>

      <!-- Small text prompt (the webview has no window.prompt) -->
      <dialog id="ask" class="ask">
        <form method="dialog">
          <label id="ask-title" for="ask-input"></label>
          <p id="ask-hint" class="ask-hint" hidden></p>
          <input id="ask-input" type="text" maxlength="80" autocomplete="off">
          <div class="ask-actions">
            <button type="button" id="ask-cancel" data-i18n="dialog.cancel"></button>
            <button type="submit" class="primary" data-i18n="dialog.ok"></button>
          </div>
        </form>
      </dialog>
    </main>

    <footer class="statusbar" id="statusbar" hidden>
      <span class="status" id="status"></span>
      <div class="scale" id="scale" data-i18n-attr="title:scale.tooltip">
        <span class="scale-bar" id="scale-bar" hidden>
